<title>Mapa Noche de los Teatros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: identidad de La Noche de los Teatros. Mapa real de Córdoba dividido en sectores angulares por zona; ventana flotante al hacer clic */
:root{
  --bg:#181818; --panel:#21211F; --line:#333331; --fg:#FFFFFF; --muted:#A8A8A4; --pin:#EA4335;
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 24px}
.lock{line-height:.9}
.lock .s{font-weight:500;font-size:clamp(18px,3vw,26px)}
.lock .b{font-weight:800;font-size:clamp(30px,5vw,46px);letter-spacing:-.02em}
.lock .t{display:block;font-weight:800;font-size:clamp(40px,7.4vw,70px);letter-spacing:-.03em}
.date{color:#FE9FF3;font-weight:500;font-size:clamp(18px,2.6vw,24px);margin-top:6px}
.sub{color:var(--muted);font-size:14px;max-width:34ch;text-align:right}
@media (max-width:600px){.sub{text-align:left}}
.mapwrap{position:relative}
.map{display:block;width:100%;height:auto}
.sector{cursor:pointer;outline:none}
.sector:hover path{filter:brightness(1.12)}
.sector path{transition:filter .15s,opacity .2s}
.map.focus .sector:not(.on) path{opacity:.35}
.sector.on path{filter:brightness(1.08)}
.sector:focus-visible path{stroke:#fff;stroke-width:4}
.foot{font-size:12px;color:var(--muted)}
/* ventana flotante */
.pop{position:absolute;z-index:10;width:min(400px,calc(100% - 8px));background:var(--panel);border-top:8px solid var(--c);box-shadow:0 12px 40px rgba(0,0,0,.55);display:flex;flex-direction:column}
.pop-h{display:flex;gap:12px;align-items:center;padding:12px 14px 10px}
.pop-h svg{width:44px;height:44px;flex:none}
.pop-h h2{margin:0;font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;color:var(--c)}
.pop-h .bar{font-size:13px;margin-top:3px}
.close{margin-left:auto;align-self:flex-start;background:none;border:1px solid var(--line);color:var(--fg);font:500 12px var(--font);padding:4px 9px;cursor:pointer}
.gmap{position:relative;background:#E9E7E2;height:220px;overflow:hidden}
.gmap svg{display:block;width:100%;height:100%}
.gmap .tag{position:absolute;left:6px;bottom:6px;background:#fff;color:#444;font-size:10px;padding:2px 6px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.stops{list-style:none;margin:0;padding:10px 14px 14px;display:grid;gap:7px}
.stops li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center}
.num{width:22px;height:22px;border-radius:50%;background:var(--pin);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center}
.stops b{font-weight:600;font-size:13px;display:block;line-height:1.2}
.stops small{color:var(--muted);font-size:11px}
.flag{color:#CFF933;font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stops a{color:var(--fg);font-size:11px;text-decoration:none;border:1px solid var(--line);padding:2px 7px;white-space:nowrap}
.stops a:hover{border-color:var(--c);color:var(--c)}
.close:focus-visible,.stops a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
@media (max-width:640px){.pop{position:fixed;left:max(12px,env(safe-area-inset-left,0px))!important;right:max(12px,env(safe-area-inset-right,0px));top:auto!important;bottom:max(12px,env(safe-area-inset-bottom,0px));width:auto;max-height:80vh;overflow:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

ZONES.forEach(z=>{

let cur=null,pinned=false,timer=null,lastPos=null;

function hide(){pop.hidden=true;cur=null;pinned=false;map.classList.remove("focus");ZONES.forEach(z=>z.g.classList.remove("on"))}
function place(e){
  const r=wrap.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  let x,y;
  if(e){x=e.clientX-r.left+18;y=e.clientY-r.top+18}else{const b=cur.g.getBoundingClientRect();x=b.left-r.left+b.width/2;y=b.top-r.top+b.height/2}
  if(x+pw>r.width)x=Math.max(0,(e?e.clientX-r.left:x)-pw-18);
  if(y+ph>r.height)y=Math.max(0,r.height-ph);
  pop.style.left=x+"px";pop.style.top=y+"px";

function show(z,e){

  careta(z,document.getElementById("pop-ico"));
